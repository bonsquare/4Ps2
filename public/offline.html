<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · 4Ps ESSI</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f8fd; color: #1e293b; font-family: system-ui, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { height: 84px; }
      h1 { margin: 16px 0 8px; color: #4338ca; font-size: 24px; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.5; }
      button { min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: #4338ca; color: #fff; font-weight: 700; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>You are offline</h1>
      <p>The 4Ps ESSI dashboard needs an internet connection to show current data. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
